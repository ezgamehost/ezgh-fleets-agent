name: CI

# Lint and the race-enabled tests, with and without the dev build tag, and the OS account
# tests as root. Linux only.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "not gofmt-ed:"; echo "$unformatted"; exit 1; }
      - run: go vet ./... && go vet -tags dev ./...
      - run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags dev ./...

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go test -race -tags dev ./...
      - name: account tests, as root
        # They create, expire and delete real accounts, so only on a disposable runner.
        run: |
          go test -race -c -o "$RUNNER_TEMP/accounts.test" ./internal/accounts
          sudo EZGH_AGENT_ROOT_TESTS=1 "$RUNNER_TEMP/accounts.test" -test.v -test.count=1
          go test -race -c -o "$RUNNER_TEMP/session.test" ./internal/session
          sudo EZGH_AGENT_ROOT_TESTS=1 "$RUNNER_TEMP/session.test" -test.v -test.count=1 -test.run 'Root$'

  packages:
    name: Packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser versions from the tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: shellcheck install.sh scripts/*.sh packaging/*.sh
      - name: install.sh dry run
        run: |
          sh install.sh --project 7a1b2c3d-0000-4000-8000-000000000003 --api-key-file /nonexistent --dry-run
          # The config takes IDs, not names: a prj_ name is refused before anything happens.
          if sh install.sh --project prj_abc --dry-run 2>err; then echo "a prj_ name was accepted"; exit 1; fi
          grep -q "a UUID" err
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: check
      - run: packaging/postinstall_test.sh
      - name: throwaway signing key, shaped like production's
        # Generated here and gone with the runner. As in production, a certify-only primary and
        # a signing subkey, and the keyring holds only the subkey's secret (sec#).
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key 'EZGH CI throwaway <ci@example.invalid>' rsa4096 cert 1d
          primary=$(gpg --batch --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          gpg --batch --passphrase '' --quick-add-key "$primary" rsa4096 sign 1d
          sub=$(gpg --batch --with-colons --list-keys "$primary" | awk -F: '$1 == "sub" { s = 1; next } s && $1 == "fpr" { print $10; exit }')
          gpg --batch --armor --export-secret-subkeys "$sub!" >"$RUNNER_TEMP/subkey.key"
          gpgconf --kill all
          rm -rf "$GNUPGHOME" && install -d -m 0700 "$GNUPGHOME"
          gpg --batch --import "$RUNNER_TEMP/subkey.key"
          gpg --batch --list-secret-keys | grep -q '^sec#' || { echo "the primary's secret is still here"; exit 1; }
          # Another key, which a tampered key file could carry along with the real one.
          gpg --batch --passphrase '' --quick-gen-key 'Not EZGH <other@example.invalid>' ed25519 sign 1d
          other=$(gpg --batch --with-colons --list-keys other@example.invalid | awk -F: '$1 == "fpr" { print $10; exit }')
          {
            echo "GNUPGHOME=$GNUPGHOME"
            echo "GPG_KEY_ID=$sub!"
            echo "PRIMARY_FPR=$primary"
            echo "OTHER_FPR=$other"
            echo "RPM_SIGNING_KEY_FILE=$RUNNER_TEMP/subkey.key"
          } >>"$GITHUB_ENV"
      - run: scripts/repo.sh pubkey build
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: release --snapshot --clean
      - run: sudo apt-get update -q && sudo apt-get install -y -q apt-utils createrepo-c
      - name: repositories
        run: |
          scripts/repo.sh build dist repo
          # The real key file, with the other key in the same armored block.
          gpg --batch --armor --export "$PRIMARY_FPR" "$OTHER_FPR" >repo/ezgh-packages.asc
          # A repository signed by the other key, serving that same file.
          GPG_KEY_ID="$OTHER_FPR" scripts/repo.sh build dist other
          cp repo/ezgh-packages.asc other/ezgh-packages.asc
      - name: install from the repository
        timeout-minutes: 15
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory repo >/dev/null 2>&1 &
          python3 -m http.server 8001 --bind 127.0.0.1 --directory other >/dev/null 2>&1 &
          run() { # run IMAGE PORT FINGERPRINT SCRIPT
            docker run --rm --network host -v "$PWD/repo:/repo:ro" \
              -e EZGH_FLEETS_REPO_URL="http://127.0.0.1:$2" -e EZGH_FLEETS_KEY_FINGERPRINT="$3" \
              "$1" sh -euxc "$4"
          }
          check='echo bot_key >/tmp/key
            sh /repo/install.sh --project 7a1b2c3d-0000-4000-8000-000000000003 --api-key-file /tmp/key
            ezgh-fleets-agent version
            test "$(stat -c %a /etc/ezgh-fleets-agent/credentials)" = 600
            grep -qx "project: 7a1b2c3d-0000-4000-8000-000000000003" /etc/ezgh-fleets-agent/config.yaml
            # Again, with the key already in place.
            sh /repo/install.sh --project 7a1b2c3d-0000-4000-8000-000000000003 --api-key-file /etc/ezgh-fleets-agent/credentials
            test "$(cat /etc/ezgh-fleets-agent/credentials)" = bot_key
            test "$(stat -c %a:%U /etc/ezgh-fleets-agent/credentials)" = 600:root'
          ubuntu='apt-get update -q && apt-get install -y -q curl'
          other_id=$(printf '%s' "$OTHER_FPR" | tail -c 8 | tr A-F a-f) # rpm names keys by it
          # A key file without the pinned key is refused before anything is installed.
          if run ubuntu:24.04 8000 0000000000000000000000000000000000000000 "$ubuntu && sh /repo/install.sh --project 7a1b2c3d-0000-4000-8000-000000000003"; then
            echo "installed from a repository with the wrong key"; exit 1
          fi
          # The pinned key is trusted alone: metadata signed by the other key in the file fails.
          if run ubuntu:24.04 8001 "$PRIMARY_FPR" "$ubuntu && sh /repo/install.sh --project 7a1b2c3d-0000-4000-8000-000000000003"; then
            echo "apt trusted the other key"; exit 1
          fi
          if run almalinux:9 8001 "$PRIMARY_FPR" "sh /repo/install.sh --project 7a1b2c3d-0000-4000-8000-000000000003"; then
            echo "dnf trusted the other key"; exit 1
          fi
          run ubuntu:24.04 8000 "$PRIMARY_FPR" "$ubuntu && $check
            test \"\$(gpg --show-keys --with-colons /etc/apt/keyrings/ezgh-packages.gpg | grep -c ^pub)\" = 1"
          run almalinux:9 8000 "$PRIMARY_FPR" "$check
            if rpm -q gpg-pubkey --qf '%{version}\\n' | grep -qx $other_id; then exit 1; fi
            rpm -K /repo/yum/x86_64/*.rpm | grep -q 'digests signatures OK'"
